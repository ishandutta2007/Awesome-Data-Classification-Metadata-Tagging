<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.65" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .pulse-orb-1 {
      animation: pulse1 8s ease-in-out infinite alternate;
    }
    .pulse-orb-2 {
      animation: pulse2 10s ease-in-out infinite alternate;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .scan-beam {
      animation: scanSweep 7s linear infinite;
    }
    @keyframes pulse1 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      100% { transform: scale(1.25) translate(40px, -20px); opacity: 0.85; }
    }
    @keyframes pulse2 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      100% { transform: scale(1.3) translate(-30px, 30px); opacity: 0.8; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes scanSweep {
      0% { transform: translateY(-10px); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(400px); opacity: 0; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs behind canvas -->
  <circle class="pulse-orb-1" cx="220" cy="120" r="180" fill="url(#orbGrad1)" />
  <circle class="pulse-orb-2" cx="980" cy="280" r="220" fill="url(#orbGrad2)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Scanner Beam -->
  <line class="scan-beam" x1="0" y1="20" x2="1200" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Ambient Floating Particles (Dynamic Visual Elements in Background) -->
  <g opacity="0.6">
    <circle class="particle" cx="150" cy="80" r="3" fill="#38bdf8" style="animation-delay: 0s;" />
    <circle class="particle" cx="1060" cy="90" r="3.5" fill="#c084fc" style="animation-delay: 1.5s;" />
    <circle class="particle" cx="180" cy="350" r="2.5" fill="#818cf8" style="animation-delay: 3s;" />
    <circle class="particle" cx="920" cy="340" r="3" fill="#38bdf8" style="animation-delay: 2s;" />
    <circle class="particle" cx="600" cy="40" r="2" fill="#c084fc" style="animation-delay: 0.8s;" />
  </g>

  <!-- Card Border Container -->
  <rect x="24" y="24" width="1152" height="372" rx="14" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- Category Tag Top Pill -->
  <g transform="translate(470, 48)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#10b981" />
    <text x="32" y="21" class="badge-pill-text" fill="#cbd5e1">DATA INTELLIGENCE &amp; DSPM</text>
  </g>

  <!-- Main Headline Title (Guaranteed Foreground) -->
  <g transform="translate(600, 135)" text-anchor="middle">
    <text class="title-text" fill="url(#textGrad)" filter="url(#glow)">Data Classification &amp; Metadata Tagging</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 182)" text-anchor="middle">
    <text class="subtitle-text">Curated Architectures, Automated PII Discovery Engines, Catalogs &amp; SaaS Governance</text>
  </g>

  <!-- Interactive/Dynamic Feature Chips Floating Below Subtitle -->
  <g transform="translate(140, 230)">
    <!-- Pill 1: Automated PII Discovery -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="26" class="badge-pill-text" fill="#7dd3fc">🔍 Automated PII Discovery</text>
    </g>

    <!-- Pill 2: Sensitivity Labeling -->
    <g transform="translate(230, 0)">
      <rect width="220" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="26" class="badge-pill-text" fill="#a5b4fc">🏷️ Sensitive Metadata Tagging</text>
    </g>

    <!-- Pill 3: Self-Hosted & OSS -->
    <g transform="translate(470, 0)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="26" class="badge-pill-text" fill="#e9d5ff">⚡ Self-Hosted OSS Engines</text>
    </g>

    <!-- Pill 4: DSPM & Cloud Catalogs -->
    <g transform="translate(700, 0)">
      <rect width="220" height="42" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="26" class="badge-pill-text" fill="#6ee7b7">🛡️ Enterprise DSPM &amp; Catalogs</text>
    </g>
  </g>

  <!-- Metrics / Tech Badges Row -->
  <g transform="translate(250, 310)">
    <!-- Stat 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="46" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#f8fafc">10+ SaaS</text>
      <text x="75" y="39" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Market Leaders</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(180, 0)">
      <rect width="150" height="46" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#f8fafc">10+ OSS</text>
      <text x="75" y="39" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">GitHub Projects</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(360, 0)">
      <rect width="170" height="46" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="85" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#f8fafc">GDPR • CCPA</text>
      <text x="85" y="39" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">HIPAA Compliance</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(550, 0)">
      <rect width="150" height="46" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#38bdf8">100% Free</text>
      <text x="75" y="39" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Community Curated</text>
    </g>
  </g>
</svg>
